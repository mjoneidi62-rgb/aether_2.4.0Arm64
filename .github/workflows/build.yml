
name: Build Aether ARM64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aether
        run: |
          curl -fL --retry 3 \
            https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-linux-aarch64-musl.tar.gz \
            -o aether.tar.gz
          tar -xzvf aether.tar.gz
          find . -maxdepth 2 -type f

      - name: Prepare binary
        run: |
          test -f ./aether
          chmod +x ./aether

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/mjoneidi62-rgb/aether_2.4.0arm64:2.4.0-arm64
